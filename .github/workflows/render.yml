name: Render Remotion Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render video
        run: npx remotion render AvoExplainer out/avo-video.mp4 --codec h264 --crf 18

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: avo-video
          path: out/avo-video.mp4
          retention-days: 7
